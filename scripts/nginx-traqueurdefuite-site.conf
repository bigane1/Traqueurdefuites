# Traqueur de fuites — reverse proxy vers Next.js (PM2, port 3004)
# Fichier dédié. Ne pas fusionner avec les vhosts yogaops / qadus / rapidea.

upstream traqueurdefuite_next {
    server 127.0.0.1:3004;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name traqueurdefuites.fr www.traqueurdefuites.fr;

    client_max_body_size 10M;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1000;

    location /_next/static/ {
        proxy_pass http://traqueurdefuite_next;
        proxy_cache_valid 200 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location / {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_pass http://traqueurdefuite_next;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }
}
